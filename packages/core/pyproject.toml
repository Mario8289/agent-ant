[project]
name = "agent-ant-core"
version = "0.1.0"
description = "Shared libraries: config, LLM client, audit, database, telemetry"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ant_core"]
