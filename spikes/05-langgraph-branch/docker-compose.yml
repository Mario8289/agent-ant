# Throwaway Postgres for spike 05 only. Port 5434 so it cannot clash with the repo's main
# Postgres (5432), spike 03's (5433) or one already running on the host.
# No volume: the data disappears when the container is removed.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-ant-spike05-postgres
    environment:
      POSTGRES_USER: agent_ant
      POSTGRES_PASSWORD: agent_ant
      POSTGRES_DB: agent_ant
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ant -d agent_ant"]
      interval: 2s
      timeout: 5s
      retries: 15
