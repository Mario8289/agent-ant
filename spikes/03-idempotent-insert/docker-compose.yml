# Throwaway Postgres for spike 03 only. Port 5433 (not 5432) so it cannot clash with the
# repo's main Postgres (infra/docker) or a Postgres already running on the host.
# No volume: the data disappears when the container is removed.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-ant-spike03-postgres
    environment:
      POSTGRES_USER: agent_ant
      POSTGRES_PASSWORD: agent_ant
      POSTGRES_DB: agent_ant
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ant -d agent_ant"]
      interval: 2s
      timeout: 5s
      retries: 15
