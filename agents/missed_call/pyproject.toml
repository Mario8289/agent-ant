[project]
name = "agent-ant-missed-call"
version = "0.1.0"
description = "Agent: missed call -> structured job record"
requires-python = ">=3.12"
dependencies = ["agent-ant-core", "boto3>=1.35"]

[tool.uv.sources]
agent-ant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ant_missed_call"]
