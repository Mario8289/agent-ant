name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for the tests that need a real Postgres (unique constraints).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_ant
          POSTGRES_PASSWORD: agent_ant
          POSTGRES_DB: agent_ant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_ant -d agent_ant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agent_ant:agent_ant@localhost:5432/agent_ant
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: just setup

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test
