[project]
name = "agent-ant-api"
version = "0.1.0"
description = "FastAPI service: webhooks, health, approval endpoints"
requires-python = ">=3.12"
dependencies = [
    "agent-ant-core",
    "agent-ant-missed-call",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv.sources]
agent-ant-core = { workspace = true }
agent-ant-missed-call = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ant_api"]
